<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SDG 2.1.1 — Prevalence of Undernourishment</title>

    <!-- Google Fonts (matches portfolio) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .map-header {
            padding: 1.2rem 1.6rem;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .map-header h1 {
            font-family: 'Merriweather', serif;
            font-size: 1.15rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.2rem;
        }

        .map-header p {
            font-size: 0.85rem;
            color: #6b7280;
        }

        #map {
            width: 100%;
            height: calc(100vh - 70px);
        }

        /* Info panel */
        .info {
            padding: 10px 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            min-width: 170px;
            line-height: 1.6;
        }

        .info h4 {
            margin: 0 0 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
        }

        .info b {
            color: #1f2937;
            font-size: 0.95rem;
        }

        /* Legend */
        .legend {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            color: #374151;
            line-height: 1.8;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 10px 14px;
        }

        .legend-title {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            margin-top: 3px;
            border-radius: 3px;
            opacity: 0.85;
        }
    </style>
</head>
<body>

<div class="map-header">
    <h1>SDG Indicator 2.1.1 — Prevalence of Undernourishment (%)</h1>
    <p>2020 · Source: UN SDG DataHub · Hover over a country to see its value</p>
</div>

<div id="map"></div>

<script type="text/javascript" src="undernourish_map.js"></script>
<script type="text/javascript">

    const map = L.map('map', { zoomControl: true }).setView([15, 15], 2);

    // Clean light basemap (CartoDB Positron — no labels clutter)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    // Info control
    const info = L.control({ position: 'topright' });

    info.onAdd = function () {
        this._div = L.DomUtil.create('div', 'info');
        this.update();
        return this._div;
    };

    info.update = function (props) {
        if (props) {
            const val = props.prev_und61;
            this._div.innerHTML = `
                <h4>Undernourishment</h4>
                <b>${props.iso3cd}</b><br>
                ${val !== null && val !== undefined ? '<span style="color:#2563eb;font-weight:600">' + val + '%</span> of population' : '<span style="color:#9ca3af">No data</span>'}
            `;
        } else {
            this._div.innerHTML = '<h4>Undernourishment</h4>Hover over a country';
        }
    };

    info.addTo(map);

    function getColor(d) {
        return d === null || d === undefined ? '#e5e7eb' :
            d > 40 ? '#005a32' :
            d > 30 ? '#238b45' :
            d > 20 ? '#41ab5d' :
            d > 10 ? '#74c476' :
            d > 0  ? '#c7e9c0' : '#e5e7eb';
    }

    function style(feature) {
        return {
            weight: 0.5,
            opacity: 1,
            color: '#9ca3af',
            fillOpacity: 0.75,
            fillColor: getColor(feature.properties.prev_und61)
        };
    }

    function highlightFeature(e) {
        const layer = e.target;
        layer.setStyle({
            weight: 2,
            color: '#2563eb',
            fillOpacity: 0.9
        });
        layer.bringToFront();
        info.update(layer.feature.properties);
    }

    const geojson = L.geoJson(nationData, {
        style,
        onEachFeature
    }).addTo(map);

    function resetHighlight(e) {
        geojson.resetStyle(e.target);
        info.update();
    }

    function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
    }

    function onEachFeature(feature, layer) {
        layer.on({
            mouseover: highlightFeature,
            mouseout: resetHighlight,
            click: zoomToFeature
        });
    }

    map.attributionControl.addAttribution('SDG data &copy; <a href="https://unstats-undesa.opendata.arcgis.com/">UN SDG DataHub</a>');

    // Legend
    const legend = L.control({ position: 'bottomright' });

    legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<div class="legend-title">% Undernourished</div>';
        const grades = [0, 10, 20, 30, 40];
        for (let i = 0; i < grades.length; i++) {
            const from = grades[i];
            const to = grades[i + 1];
            div.innerHTML +=
                `<div><i style="background:${getColor(from + 1)}"></i>${from}${to ? '–' + to : '+'}</div>`;
        }
        div.innerHTML += `<div><i style="background:#e5e7eb"></i>No data</div>`;
        return div;
    };

    legend.addTo(map);

</script>
</body>
</html>
